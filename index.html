/* FinUp v2.1.3 — quick transaction chooser and IDR amount field. */
.quick-add-wrap{position:fixed;z-index:140;inset:0;background:rgba(5,14,22,.6);display:flex;align-items:center;justify-content:center;padding:22px}
.quick-add-card{width:min(100%,390px);background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 24px 70px rgba(0,0,0,.28)}
.quick-add-card h3{margin:0 0 5px;font-size:20px}.quick-add-card p{margin:0 0 17px;color:var(--muted);font-size:12px}
.quick-add-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.quick-add-choice{border:1px solid var(--line);background:var(--surface2);border-radius:18px;padding:20px 10px;font-weight:850;color:var(--text)}
.quick-add-choice i{display:flex;align-items:center;justify-content:center;width:48px;height:48px;margin:0 auto 10px;border-radius:16px;font-size:25px;font-style:normal}.quick-add-choice.income i{background:var(--green-soft);color:var(--green2)}.quick-add-choice.expense i{background:var(--red-soft);color:var(--red)}
.quick-add-cancel{width:100%;margin-top:13px}.idr-input-note{font-size:10px;color:var(--muted);margin-top:5px}

/* FinUp v2.3.1 startup session gate and login keyboard handling. */
.boot-screen{background:linear-gradient(155deg,var(--navy),var(--navy2));color:#fff;text-align:center;padding:28px}
.boot-card{display:flex;flex-direction:column;align-items:center;gap:12px}
.boot-card img{width:76px;height:76px;border-radius:22px;box-shadow:0 12px 34px rgba(0,0,0,.22)}
.boot-card h1{margin:0;font-size:29px}.boot-card p{margin:0;color:#d7e6ed;font-size:13px}
.boot-loader{width:28px;height:28px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .85s linear infinite;margin-top:8px}
/* FinUp v2.3.0 production accessibility and large-list controls. */
:focus-visible{outline:3px solid rgba(15,186,133,.55);outline-offset:2px}
.tx-load-more-v230{width:100%;margin:8px 0 4px;min-height:46px}

@media (prefers-contrast:more){.list-item,.card,.input,.tab,.menu-card{border-width:2px}.tiny,.list-text small{color:var(--text)}}

function infoContent(kind) { if (kind === 'tutorial')
    return `<div class="legal"><h2>Tutorial FinUp v2.0.1</h2><h3>1. Login dan verifikasi email</h3><p>Daftar menggunakan email dan kata sandi. Setelah membuka link verifikasi di browser, kembali ke FinUp. Status diperiksa otomatis, token diperbarui, dan banner hilang tanpa login ulang.</p><h3>2. Dashboard dan sinkronisasi</h3><p>Pilih ringkasan hari, minggu, bulan, atau tahun. Tarik Dashboard ke bawah dari posisi paling atas untuk refresh dan sinkronisasi Firebase.</p><h3>3. Halaman fitur</h3><p>Akun Keuangan, Kategori, Utang & Piutang, Pengaturan, Tutorial, halaman legal, serta formulir kini terbuka sebagai halaman penuh. Gunakan tombol kembali pada header atau tombol kembali Android untuk kembali ke halaman sebelumnya.</p><h3>4. Transaksi</h3><p>Tambah, ubah, hapus, urungkan penghapusan, dan salin transaksi melalui formulir pratinjau. Filter berdasarkan kata kunci, jenis, rentang tanggal, akun, kategori, dan nominal. Nomor referensi serta catatan tetap dapat digunakan tanpa mengunggah foto.</p><h3>5. Akun dan kategori</h3><p>Akun dan kategori dapat diurutkan serta dinonaktifkan. Jika masih digunakan, FinUp menawarkan pemindahan data sebelum penghapusan.</p><h3>6. Anggaran</h3><p>Buat anggaran mingguan atau bulanan. Peringatan muncul pada 50%, 80%, dan 100%. Sisa anggaran dapat dibawa ke periode berikutnya.</p><h3>7. Target tabungan</h3><p>Catat setoran dan penarikan, lihat riwayat, hubungkan ke akun tabungan, dan lihat perkiraan target tercapai.</p><h3>8. Transaksi berulang</h3><p>Gunakan frekuensi harian, mingguan, bulanan, atau tahunan. Jadwal dapat dibuat otomatis, menunggu konfirmasi, dijeda, dan diingatkan sebelum jatuh tempo.</p><h3>9. Utang dan piutang</h3><p>Catat pembayaran sebagian dan riwayat. Pilih akun agar pembayaran otomatis dibuat sebagai transaksi pemasukan atau pengeluaran.</p><h3>10. Laporan dan backup</h3><p>Ekspor laporan CSV/PDF dan backup JSON. Saat impor, pilih Gabungkan atau Ganti seluruh data.</p><h3>11. Keamanan</h3><p>Aktifkan PIN, biometrik, kunci otomatis, perlindungan tangkapan layar, mode privasi nominal, mode gelap, dan ukuran teks.</p></div>`; if (kind === 'privacy')
    return `<div class="legal"><h2>Privacy Policy FinUp</h2><p><b>Berlaku mulai:</b> 19 Juli 2026 · <b>Versi kebijakan:</b> 2.0.1</p><h3>Data yang diproses</h3><ul><li>Email, UID pengguna, dan status verifikasi untuk autentikasi.</li><li>Data keuangan yang Anda masukkan: akun, transaksi, kategori, anggaran, target, jadwal berulang, utang, piutang, nomor referensi, catatan, dan riwayat aktivitas.</li><li>Pengaturan keamanan lokal seperti hash PIN, preferensi biometrik, mode privasi, tema, dan ukuran teks.</li></ul><h3>Foto transaksi</h3><p>FinUp v2.0.1 tidak menyediakan unggah atau penyimpanan foto bukti transaksi. Data foto bukti yang berasal dari versi sebelumnya dibersihkan dari data transaksi saat migrasi.</p><h3>Tujuan penggunaan</h3><p>Data digunakan untuk menjalankan fitur FinUp, menyinkronkan perangkat, memulihkan data, membuat laporan, dan menjaga keamanan akun. FinUp tidak menjual data pribadi kepada pengiklan.</p><h3>Penyimpanan</h3><p>Data keuangan disimpan secara lokal dan pada Firebase milik FinUp berdasarkan UID pengguna. PIN disimpan sebagai hash lokal. Data biometrik diproses oleh sistem Android dan tidak diterima atau disimpan oleh FinUp.</p><h3>Backup dan laporan</h3><p>File JSON, CSV, atau PDF berada di lokasi yang Anda pilih. Anda bertanggung jawab menjaga file tersebut.</p><h3>Penghapusan</h3><p>Pengguna dapat menghapus akun dan seluruh data melalui Pengaturan. Penghapusan bersifat permanen.</p><h3>Kontak</h3><p>Email dukungan: <b>upidgedang@gmail.com</b></p></div>`; if (kind === 'terms')
    return `<div class="legal"><h2>Ketentuan Layanan FinUp</h2><p><b>Berlaku mulai:</b> 19 Juli 2026 · <b>Versi ketentuan:</b> 2.0</p><h3>Penggunaan aplikasi</h3><p>FinUp adalah alat pencatatan dan perencanaan keuangan pribadi, bukan layanan perbankan, investasi, akuntansi profesional, atau penasihat keuangan.</p><h3>Tanggung jawab pengguna</h3><p>Pengguna bertanggung jawab atas ketepatan data, keamanan akun, pemeriksaan hasil sinkronisasi, dan penyimpanan file backup atau laporan.</p><h3>Ketersediaan layanan</h3><p>Sinkronisasi bergantung pada koneksi internet dan Firebase. Perubahan offline disimpan dalam antrean dan dikirim ketika koneksi tersedia.</p><h3>Pembatasan tanggung jawab</h3><p>Pengembang tidak bertanggung jawab atas keputusan finansial, data yang dimasukkan secara salah, kegagalan perangkat, atau file backup yang tidak dijaga pengguna.</p></div>`; return `<div class="version-box"><img src="logo-mark.png"><h2>FinUp</h2><p>Atur uang, raih tujuan.</p><span class="badge badge-green">Versi ${APP_VERSION}</span><p>Version Code ${VERSION_CODE}</p></div><div class="legal"><h3>Yang baru di v2.0.1</h3><ul><li>Fitur unggah dan penyimpanan foto bukti transaksi dihapus agar penyimpanan serta sinkronisasi Firebase tetap ringan.</li><li>Data foto bukti dari versi sebelumnya dibersihkan otomatis saat migrasi.</li><li>Seluruh modul, halaman baca, dan formulir kini dibuka sebagai halaman penuh dengan header serta tombol kembali.</li><li>Gestur tarik turun pada halaman fitur dihapus; tarik ke bawah tetap digunakan khusus pada Dashboard untuk refresh.</li><li>Laporan CSV, Tutorial, Privacy Policy, dan informasi versi diperbarui.</li></ul><h3>Teknologi</h3><p>Firebase Authentication dan Cloud Firestore digunakan berdasarkan UID pengguna. Biometrik diproses oleh sistem Android.</p><h3>Kontak dukungan</h3><p>upidgedang@gmail.com</p></div>`; }

baan otomatis sementara. Data lokal tetap aman dan dapat disinkronkan setelah kuota tersedia.</li><li>Jangan menghapus data aplikasi saat masih ada perubahan yang belum tersinkron.</li></ul><h3>4. Menambah transaksi</h3><ul><li>Pilih <b>Pemasukan</b>, <b>Pengeluaran</b>, atau <b>Transfer</b>.</li><li>Isi tanggal, nominal, akun, kategori, catatan, dan nomor referensi bila diperlukan.</li><li>Transfer memindahkan saldo dari akun asal ke akun tujuan dan tidak dihitung sebagai pemasukan.</li><li>Satu transfer dihitung sebagai satu transaksi untuk kuota FinUp Free.</li><li>Foto bukti transaksi tidak digunakan agar penyimpanan dan sinkronisasi tetap ringan.</li></ul><h3>5. Daftar, pencarian, dan filter transaksi</h3><ul><li>Cari transaksi melalui kata kunci pada catatan atau referensi.</li><li>Filter berdasarkan jenis, tanggal awal–akhir, akun, kategori, dan rentang nominal.</li><li>Tekan <b>Reset Filter</b> untuk menampilkan seluruh transaksi kembali.</li><li>Filter membantu memeriksa pengeluaran tertentu atau menyiapkan laporan periode khusus.</li></ul><h3>6. Edit, hapus, urungkan, dan Salin Transaksi</h3><ul><li><b>Edit</b> memperbarui transaksi lama dan saldo terkait tanpa menambah kuota transaksi.</li><li><b>Hapus</b> menghapus transaksi, tetapi penghitung transaksi seumur hidup tidak berkurang.</li><li>Setelah penghapusan, gunakan <b>Urungkan</b> selama tombol masih tampil untuk memulihkan transaksi.</li><li><b>Salin Transaksi</b> membuka formulir baru yang sudah terisi dari transaksi lama. Periksa tanggal, nominal, akun, kategori, dan catatan sebelum menekan Simpan.</li><li>Salinan baru baru dihitung ke kuota setelah benar-benar disimpan.</li></ul><h3>7. Akun Keuangan</h3><ul><li>Kelola akun Tunai, Rekening Bank, Tabungan, E-Wallet, atau akun lain yang Anda buat.</li><li>Tentukan saldo awal, jenis akun, ikon, urutan, dan status aktif.</li><li>Akun nonaktif tidak ditawarkan pada transaksi baru, tetapi riwayat lama tetap tersimpan.</li><li>Jika akun masih dipakai transaksi, pindahkan transaksi ke akun pengganti sebelum menghapusnya.</li><li>Saldo akun dihitung dari saldo awal ditambah pemasukan, dikurangi pengeluaran, serta transfer masuk/keluar.</li></ul><h3>8. Kategori</h3><ul><li>Kategori dipisahkan menjadi pemasukan dan pengeluaran.</li><li>Tambahkan nama, ikon, urutan, atau nonaktifkan kategori yang tidak digunakan.</li><li>Jika kategori masih digunakan transaksi, pilih kategori pengganti sebelum penghapusan.</li><li>Kategori membantu grafik, anggaran, filter, dan laporan menjadi lebih akurat.</li></ul><h3>9. Anggaran</h3><ul><li>Buat anggaran <b>mingguan</b> atau <b>bulanan</b> untuk kategori pengeluaran.</li><li>FinUp menghitung pemakaian, sisa nominal, dan persentase anggaran.</li><li>Pengingat dapat muncul pada 50%, 80%, dan 100% sesuai pengaturan.</li><li>Opsi membawa sisa anggaran dapat digunakan untuk menambahkan sisa periode sebelumnya.</li><li>Pastikan transaksi memakai kategori yang sama agar pemakaian anggaran terhitung.</li></ul><h3>10. Target Tabungan</h3><ul><li>Buat target dengan nama, nominal tujuan, tanggal target, dan akun yang terkait.</li><li>Tambahkan setoran atau penarikan dan lihat riwayat perubahan target.</li><li>FinUp menampilkan progres, sisa kebutuhan, serta perkiraan target tercapai berdasarkan kebiasaan setoran.</li><li>Setoran yang dibuat sebagai transaksi ikut memengaruhi saldo akun dan kuota transaksi.</li></ul><h3>11. Transaksi Berulang</h3><ul><li>Gunakan untuk gaji, tagihan, cicilan, langganan, atau transaksi rutin lainnya.</li><li>Pilih frekuensi harian, mingguan, bulanan, atau tahunan.</li><li>Pilih pembuatan otomatis atau menunggu konfirmasi sebelum transaksi dicatat.</li><li>Jadwal dapat dijeda dan diaktifkan kembali.</li><li>Untuk tanggal 29–31, FinUp menyesuaikan ke tanggal terakhir pada bulan yang lebih pendek.</li><li>Setiap transaksi baru yang dibuat dari jadwal ikut dihitung ke kuota.</li></ul><h3>12. Utang dan Piutang</h3><ul><li>Catat jenis utang atau piutang, nama pihak, nominal awal, tanggal, dan jatuh tempo.</li><li>Masukkan pembayaran sebagian; FinUp menampilkan sisa dan riwayat pembayaran.</li><li>Pilih akun agar pembayaran dapat dibuat sebagai transaksi pengeluaran untuk utang atau pemasukan untuk piutang.</li><li>Status berubah menjadi lunas setelah seluruh nominal dibayar.</li></ul><h3>13. Laporan</h3><ul><li>Pilih rentang tanggal, akun, kategori, dan jenis transaksi yang ingin dilaporkan.</li><li>Laporan menampilkan pemasukan, pengeluaran, arus kas, transaksi, dan ringkasan kategori.</li><li>Ekspor <b>CSV</b> untuk dibuka di aplikasi spreadsheet.</li><li>Ekspor <b>PDF</b> untuk laporan yang siap dibaca atau dibagikan.</li><li>Periksa kembali filter sebelum mengekspor agar periode laporan sesuai.</li></ul><h3>14. Pusat Pengingat dan notifikasi</h3><ul><li>Pusat Pengingat merangkum anggaran, target, transaksi berulang, utang, dan piutang yang perlu diperhatikan.</li><li>Aktifkan Notifikasi Sistem dan tentukan berapa hari sebelum jatuh tempo pengingat ditampilkan.</li><li>Android 13 atau lebih baru dapat meminta izin notifikasi saat fitur pertama kali diaktifkan.</li></ul><h3>15. Riwayat Aktivitas</h3><ul><li>Riwayat Aktivitas mencatat tindakan penting seperti backup, impor, perubahan akun, perubahan keamanan, dan pemulihan data.</li><li>Gunakan riwayat ini untuk membantu menelusuri perubahan yang pernah dilakukan.</li></ul><h3>16. Backup JSON dan pemulihan data</h3><ul><li><b>Ekspor Backup JSON</b> menyimpan akun, kategori, transaksi, anggaran, target, jadwal, utang/piutang, aktivitas, dan pengaturan yang didukung.</li><li>Simpan file backup di tempat aman sebelum mengganti HP, menghapus aplikasi, atau melakukan perubahan besar.</li><li>Saat impor, pilih <b>Gabungkan</b> untuk mempertahankan data saat ini dan menambahkan data yang belum ada.</li><li>Pilih <b>Ganti Data</b> untuk mengganti seluruh data lokal dengan isi backup.</li><li>Transaksi baru dari impor dapat ikut menambah penghitung transaksi seumur hidup; transaksi dengan ID yang sama tidak dihitung dua kali.</li></ul><h3>17. Keamanan dan privasi aplikasi</h3><ul><li>Aktifkan PIN enam digit untuk mengunci FinUp.</li><li>Setelah PIN aktif dan perangkat mendukungnya, aktifkan biometrik sidik jari atau wajah.</li><li>Atur kunci otomatis: langsung, 1 menit, 5 menit, atau 15 menit setelah aplikasi ditinggalkan.</li><li>Aktifkan perlindungan tangkapan layar untuk mencegah screenshot dan menyembunyikan tampilan pada recent apps.</li><li>Sembunyikan nominal apabila aplikasi digunakan di tempat umum.</li></ul><h3>18. Tampilan</h3><ul><li>Pilih tema mengikuti perangkat, Terang, atau Gelap.</li><li>Pilih ukuran teks Kecil, Normal, Besar, atau Sangat Besar.</li><li>Perubahan tampilan diterapkan tanpa mengubah data keuangan.</li></ul><h3>19. Akun dan login</h3><ul><li>Ubah email melalui Pengaturan; email baru harus diverifikasi kembali.</li><li>Ubah kata sandi melalui menu Akun & Login. Firebase dapat meminta login ulang jika sesi sudah terlalu lama.</li><li>Keluar hanya menghapus sesi di perangkat dan tidak menghapus data cloud.</li><li>Hapus Akun & Data menghapus data secara permanen dan memerlukan koneksi internet. Buat backup terlebih dahulu.</li></ul><h3>20. FinUp Free dan FinUp Pro</h3><ul><li>Setiap Firebase UID mendapat 1.000 transaksi gratis seumur hidup.</li><li>Menu aktivasi disembunyikan sampai transaksi ke-900.</li><li>Pengingat muncul pada 900, 950, 990, 999, dan 1.000 transaksi.</li><li>Transaksi ke-1.000 tetap dapat disimpan; transaksi baru setelahnya memerlukan lisensi aktif.</li><li>Edit atau hapus tidak mengembalikan kuota. Transaksi baru dari salinan, jadwal, target, utang/piutang, atau impor ikut dihitung.</li><li>Lisensi Tahunan atau Lifetime terikat ke Firebase UID dan tidak membatasi jumlah perangkat.</li><li>Setelah aktivasi berhasil, banner kuota hilang. Informasi lisensi tetap dapat dibuka melalui menu FinUp Pro.</li></ul><h3>21. Navigasi dan gestur</h3><ul><li>Semua modul dan formulir dibuka sebagai halaman penuh.</li
