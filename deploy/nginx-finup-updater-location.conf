# API updater hanya diteruskan ke service lokal. Token admin tetap diwajibkan
# oleh service untuk endpoint GET /status dan POST /run.
location /api/finup-update/ {
    proxy_pass http://127.0.0.1:8731;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-FinUp-Update-Token $http_x_finup_update_token;
    proxy_connect_timeout 5s;
    proxy_read_timeout 180s;
    client_max_body_size 4k;
    add_header Cache-Control "no-store" always;
}
